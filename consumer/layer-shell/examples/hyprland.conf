# Hyprland 0.54-and-earlier hyprlang snippet for ~/.config/hypr/hyprland.conf.
# Hyprland 0.55+ uses the Lua snippet in hyprland.lua.
# Namespace: vivid  (hyprctl layers)

exec-once = vivid-layer-shell-consumer
# Bottom-layer widgets covering the wallpaper (caelestia, etc.):
# exec-once = vivid-layer-shell-consumer --layer background

layerrule = no_anim on, match:namespace vivid
# Older Hyprland:
# layerrule = noanim, vivid

# Do not also exec-once hyprpaper or swaybg.

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
